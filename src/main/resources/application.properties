spring.application.name=rent.manager

#Servelet
server.servlet.context-path=/rent-manager
server.port=8083
server.address=0.0.0.0

#DATABASE SETUP
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# CORS CONFIG
app.cors.allowed-origins=http://localhost:8080,http://localhost:4173,http://192.168.1.81:4173,http://localhost:4173,http://localhost:4175
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
