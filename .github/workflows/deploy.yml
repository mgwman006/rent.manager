name: Deploy Auth Manager to Dev Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SERVER_PORT: 8083

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (local build only)
        run: echo "Building Docker image..."

      - name: Build Docker image
        run: docker buildx build --platform linux/amd64 -t rent-manager:dev --load .

      - name: Save Docker image as tar
        run: docker save rent-manager:dev | gzip > rent-manager.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST_NAME }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "rent-manager.tar.gz"
          target: "/home/ubuntu/rent-manager"

      - name: Deploy on EC2
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_NAME }} \
          "DB_URL='${{ secrets.DB_URL }}' \
           DB_USERNAME='${{ secrets.DB_USERNAME }}' \
           DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
           bash -s" << 'EOF'

          set -e

          cd /home/ubuntu/rent-manager

          echo "Stopping old container..."
          sudo docker stop auth-manager || true
          sudo docker rm auth-manager || true

          echo "Loading new image..."
          gunzip -c auth-manager.tar.gz | sudo docker load

          echo "Starting new container..."
          sudo docker run -d \
            --name rent-manager \
            --restart always \
            -p 8083:8083 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            rent-manager:dev

          EOF

          rm private_key