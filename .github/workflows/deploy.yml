name: Deploy to Tante EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Deploy to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: 'target/landlordtenant-*.jar'
          target: '/home/ubuntu/landlordtenant/landlordtenant.jar'
          
      - name: Install Java
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            echo 'Installing Java...'
            sudo apt update
            sudo apt install -y openjdk-17-jre-headless
          " || true
          rm private_key
      - name: Restart Spring Boot app
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            set -x
            echo 'Stopping existing process...'
            pkill -TERM -f landlordtenant || true
            echo 'Starting new process...'
            cd /home/ubuntu/landlordtenant
            nohup java -jar landlordtenant.jar/target/landlordtenant-0.0.1-SNAPSHOT.jar > /dev/null 2>&1 &
          " || true
          rm private_key
      
