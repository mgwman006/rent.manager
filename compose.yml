services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: tante-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tante
      RABBITMQ_DEFAULT_PASS: tante_dev_2026
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
